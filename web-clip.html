    function uuid() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
        var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8)
        return v.toString(16)
      })
    }

    function validate() {

      let ok = true

      let ip1 = document.getElementById("ip1").value.trim()
      let ip2 = document.getElementById("ip2").value.trim()
      let dnsid = document.getElementById("dnsid").value.trim()
      let email = document.getElementById("email").value.trim()

      document.getElementById("e1").innerText = ""
      document.getElementById("e2").innerText = ""
      document.getElementById("e3").innerText = ""
      document.getElementById("e4").innerText = ""

      if (!dnsid) { document.getElementById("e1").innerText = "NextDNS ID không được để trống"; ok = false }
      if (!ip1) { document.getElementById("e2").innerText = "DNS Servers IP 1 không được để trống"; ok = false }

      if (!email) { document.getElementById("e4").innerText = "acc ( email ) không được để trống"; ok = false }

      return ok
    }

    function downloadFile() {

      let xml = document.getElementById("output").value
      if (!xml) { alert("Generate first"); return }

      let filename = document.getElementById("filename").value
      let email = document.getElementById("email").value

      if (!filename) {
        filename = email.split("@")[0]
      }

      let blob = new Blob([xml], { type: "text/xml" })
      let a = document.createElement("a")
      a.href = URL.createObjectURL(blob)
      a.download = filename + ".mobileconfig"
      a.click()

    }

    function copyText(text) {
      navigator.clipboard.writeText(text)
      alert("Copied: " + text)
    }

  </script>
