<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>nextDNS MobileConfig by Tống Trần Kiên</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />

  <style>
    body {
      font-family: Arial;
      background: #f4f6f8;
      padding: 40px;
      max-width: 700px;
      margin: auto
    }

    h2 {
      text-align: center
    }

    label {
      font-weight: bold
    }

    .input-group {
      position: relative;
      margin-top: 5px;
      margin-bottom: 5px
    }

    input {
      width: 100%;
      padding: 10px 35px 10px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box
    }

    .clear-btn {
      position: absolute;
      right: 8px;
      top: 35%;
      transform: translateY(-50%);
      background: #ddd;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      cursor: pointer;
      font-size: 12px;
      line-height: 20px;
      padding: 0
    }

    /* clear-btn hover */
    .clear-btn:hover {
      color: white;
      transform: translateY(-50%) scale(1.2);
    }

    /* clear-btn click */
    .clear-btn:active {
      transform: translateY(-50%) scale(1.5);
      background: #d9363e;
    }

    .error {
      color: rgb(173, 11, 138);
      font-size: 13px;
      margin-bottom: 10px
    }

    button {
      padding: 10px 16px;
      margin: 5px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold
    }

    .generate {
      background: #2ecc71;
      color: white
    }

    .download {
      background: #3498db;
      color: white
    }

    .copy {
      background: #555;
      color: white
    }

    textarea {
      width: 100%;
      height: 400px;
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc
    }

    .required {
      color: red
    }
  </style>
</head>

<body>

  <h2>nextDNS MobileConfig by Tống Trần Kiên</h2>


  <div class="nav-buttons" style="text-align: center;">
    <!-- <button class="btn-nav" style="background-color: rgb(15, 151, 175);" onclick="window.location.href='./index.html'">← No Web Clip</button> -->
    <button class="btn-nav" style="background-color: rgb(34, 197, 99);" onclick="window.location.href='./web-clip.html'">→ Web Clip</button>
  </div>



  <label>NextDNS ID <span class="required">*</span></label>
  <div class="input-group">
    <input id="dnsid" placeholder="c8aa33">
    <button class="clear-btn" onclick="clearInput('dnsid')">✕</button>
  </div>
  <div class="error" id="e1"></div>

  <label>DNS Servers IP 1 <span class="required">*</span></label>
  <div class="input-group">
    <input id="ip1" placeholder="45.90.28.218">
    <button class="clear-btn" onclick="clearInput('ip1')">✕</button>
  </div>
  <div class="error" id="e2"></div>

  <label>DNS Servers IP 2 <span class="required">*</span></label>
  <div class="input-group">
    <input id="ip2" placeholder="45.90.30.218">
    <button class="clear-btn" onclick="clearInput('ip2')">✕</button>
  </div>
  <div class="error" id="e3"></div>

  <label>acc ( email ) <span class="required">*</span></label>
  <div class="input-group">
    <input id="email" placeholder="ttk-nextdns-01@tongtrankien.io.vn">
    <button class="clear-btn" onclick="clearInput('email')">✕</button>
  </div>
  <div class="error" id="e4"></div>

  <label>File name download (optional)</label>
  <div class="input-group">
    <input id="filename" placeholder="LocketGold_01_by_TongTranKien">
    <button class="clear-btn" onclick="clearInput('filename')">✕</button>
  </div>

  <br><br>

  <button class="copy" onclick="copyText('ttk-nextdns-01@tongtrankien.io.vn')">Copy mail [
    ttk-nextdns-01@tongtrankien.io.vn ]</button>
  <button class="copy" onclick="copyText('LocketGold_01_by_TongTranKien')">Copy name [ LocketGold_01_by_TongTranKien
    ]</button>



  <br><br>

  <button class="generate" onclick="generate()">Generate Data</button>
  <button class="download" onclick="downloadFile()">Download File</button>
  <button class="copy" onclick="copyText('revenuecat.com')">Copy [revenuecat.com]</button>
  <button class="copy" onclick="copyText('*.api.revenuecat.com')">Copy [ *.api.revenuecat.com ]</button>

  <br> <br>

  <textarea id="output"></textarea>

  <script>

    function uuid() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
        var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8)
        return v.toString(16)
      })
    }

    function clearInput(id) {
      document.getElementById(id).value = ""
    }

    function validate() {

      let ok = true

      let ip1 = document.getElementById("ip1").value.trim()
      let ip2 = document.getElementById("ip2").value.trim()
      let dnsid = document.getElementById("dnsid").value.trim()
      let email = document.getElementById("email").value.trim()

      document.getElementById("e1").innerText = ""
      document.getElementById("e2").innerText = ""
      document.getElementById("e3").innerText = ""
      document.getElementById("e4").innerText = ""

      if (!dnsid) { document.getElementById("e1").innerText = "NextDNS ID không được để trống"; ok = false }
      if (!ip1) { document.getElementById("e2").innerText = "DNS Servers IP 1 không được để trống"; ok = false }
      if (!ip2) { document.getElementById("e3").innerText = "DNS Servers IP 2 không được để trống"; ok = false }
      if (!email) { document.getElementById("e4").innerText = "acc ( email ) không được để trống"; ok = false }

      return ok
    }

    function generate() {

      if (!validate()) return

      let ip1 = document.getElementById("ip1").value
      let ip2 = document.getElementById("ip2").value
      let dnsid = document.getElementById("dnsid").value
      let email = document.getElementById("email").value

      let username = email.split("@")[0]

      let uuid1 = uuid()
      let uuid2 = uuid()

      let xml = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
  <dict>
    <key>PayloadContent</key>
    <array>
      <dict>
        <key>DNSSettings</key>
        <dict>
          <key>DNSProtocol</key>
          <string>HTTPS</string>
          <key>ServerAddresses</key>
          <array>
            <string>${ip1}</string>
            <string>${ip2}</string>
            <string>2a07:a8c0::</string>
            <string>2a07:a8c1::</string>
          </array>
          <key>ServerName</key>
          <string>${dnsid}.dns.nextdns.io</string>
          <key>ServerURL</key>
          <string>https://dns.nextdns.io/${dnsid}</string>
        </dict>
        <key>OnDemandRules</key>
        <array>
          <dict>
            <key>Action</key>
            <string>Connect</string>
            <key>InterfaceTypeMatch</key>
            <string>WiFi</string>
          </dict>
          <dict>
            <key>Action</key>
            <string>Connect</string>
            <key>InterfaceTypeMatch</key>
            <string>Cellular</string>
          </dict>
          <dict>
            <key>Action</key>
            <string>Connect</string>
          </dict>
        </array>
        <key>PayloadDescription</key>
        <string>Configures device to use Locket Gold Encrypted DNS over HTTPS</string>
        <key>PayloadDisplayName</key>
        <string>Locket Gold By Tống Trần Kiên</string>
        <key>PayloadIdentifier</key>
        <string>${username}.locketgold.dns.managed</string>
        <key>PayloadType</key>
        <string>com.apple.dnsSettings.managed</string>
        <key>PayloadUUID</key>
        <string>${uuid1}</string>
        <key>PayloadVersion</key>
        <integer>1</integer>
        <key>ProhibitDisablement</key>
        <false/>
      </dict>
    </array>
    <key>PayloadDescription</key>
    <string>
--- Cấu hình DNS giữ Locket Gold ---
acc: ${email}
Coder: Tống Trần Kiên ( Kiên BT )
SĐT: 0989.339.485
Website: tongtrankien.io.vn
Donate: 1989.339.485 - Vietcombank
Email: tongtrankien1605@gmail.com
</string>
    <key>PayloadDisplayName</key>
    <string>Locket Gold by Tong Tran Kien</string>
    <key>PayloadIdentifier</key>
    <string>${username}.locketgold.config</string>
    <key>PayloadOrganization</key>
    <string>Tống Trần Kiên - 03/07/2004</string>
    <key>PayloadRemovalDisallowed</key>
    <false/>
    <key>PayloadType</key>
    <string>Configuration</string>
    <key>PayloadUUID</key>
    <string>${uuid2}</string>
    <key>PayloadVersion</key>
    <integer>1</integer>
  </dict>
</plist>`

      document.getElementById("output").value = xml

    }

    function downloadFile() {

      let xml = document.getElementById("output").value
      if (!xml) { alert("Generate first"); return }

      let filename = document.getElementById("filename").value
      let email = document.getElementById("email").value

      if (!filename) {
        filename = email.split("@")[0]
      }

      let blob = new Blob([xml], { type: "text/xml" })
      let a = document.createElement("a")
      a.href = URL.createObjectURL(blob)
      a.download = filename + ".mobileconfig"
      a.click()

    }

    function copyText(text) {
      navigator.clipboard.writeText(text)
      alert("Copied: " + text)
    }

  </script>

</body>

</html>
